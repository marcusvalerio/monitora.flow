# Agendador da coleta: chama /api/coletar a cada 10 min.
# Exige os secrets COLETOR_URL e CRON_SECRET em Settings → Secrets and variables → Actions
# (CRON_SECRET igual ao da Vercel). O GitHub pode atrasar execuções agendadas em alguns minutos;
# a janela do SPPO continua de onde a última coleta parou (até 20 min).
name: coletar
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Dispara /api/coletar
        env:
          COLETOR_URL: ${{ secrets.COLETOR_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          # Aceita o secret com ou sem "https://" e com ou sem "/" no final.
          base="${COLETOR_URL%/}"
          case "$base" in http://*|https://*) ;; *) base="https://$base" ;; esac
          resp=$(curl -fsSL --post301 --post302 --post303 --max-time 90 -X POST \
            -H "Authorization: Bearer $CRON_SECRET" "$base/api/coletar")
          echo "$resp" | head -c 600; echo
          # Só conta como sucesso se a API devolveu o resumo da coleta.
          echo "$resp" | grep -q '"inicio"' 
